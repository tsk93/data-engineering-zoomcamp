version: 2

macros:
  - name: get_payment_type_description
    description: >
      This macro receives a payment_type and returns the corresponding description.
    arguments:
      - name: payment_type
        type: int
        description: > 
          payment_type value.
          Must be one of the accepted values, otherwise the macro will return null
  - name: pickup_date_quarter
    description: >
      Returns the month of pickup datetime.
    arguments:
      - name: pickup_datetime
        type: timestamp
        description: > 
          quarter of pickup datetime
          Must be one of the accepted values, otherwise the macro will return null